name: harvest

# Same cadence as the local cron, in UTC.  Scheduled runs on GitHub are
# best-effort: under load they can start late or be dropped, so every step is
# safe to repeat and state is only advanced at the end.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: harvest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the inputs the packers read never change during a harvest run, so the
      # cache serves them instead of pulling ~50 MB from R2 on every slot
      - name: Restore static inputs
        uses: actions/cache@v4
        with:
          key: harvest-inputs-v2
          path: |
            ws/mgeko-tags-ui/cache/sources/import.jsonl
            ws/mgeko-tags-ui/cache/kun_index
            ws/mgeko-tags/output/mangagg.tsv
            ws/mgeko-tags/output/catalog_full.jsonl
            ws/mgeko-tags/cache/catalog/info.jsonl
            ws/mgeko-tags/cache/catalog/first_seen.json
            ws/mgeko-tags/cache/mangagg_meta.jsonl

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Prepare
        run: bash harvest_job.sh prepare

      - name: Harvest
        run: bash harvest_job.sh run

      - name: Save state
        if: always()
        run: bash harvest_job.sh save

      # the worker's source lives in this repo now, so publishing it is part of
      # the run: the midnight slot deploys, the other three leave it alone
      - name: Deploy the worker
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *'
        working-directory: cloud
        run: wrangler deploy --message "harvest run ${{ github.run_id }}"

      # GitHub turns a scheduled workflow off after 60 days without a commit and
      # this job only writes to R2, so a fortnightly touch keeps the cron armed
      - name: Keep the schedule armed
        if: always()
        run: |
          stamp=$(tail -n 1 .github/heartbeat.txt 2>/dev/null || true)
          if [ -n "$stamp" ] && [ $(( $(date -u +%s) - $(date -u -d "$stamp" +%s) )) -lt 1209600 ]; then
            echo "heartbeat is recent ($stamp); nothing to do"
            exit 0
          fi
          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ >> .github/heartbeat.txt
          git add .github/heartbeat.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Keep the harvest schedule armed"
          # scheduled runs check out a detached HEAD, so name the branch
          git push origin HEAD:main
