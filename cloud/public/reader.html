<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Reader</title>
<style>
  :root{
    --bg:#070708;--panel:#111113;--line:#242426;--muted:#8e8e93;
    --text:#f5f5f7;--accent:#ff453a;--bar-top:calc(10px + env(safe-area-inset-top));
    --bar-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box}
  html{background:var(--bg);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
  a{color:inherit}
  button,select{font:inherit}
  ::selection{background:rgba(255,69,58,.35)}
  body.reading{cursor:default}
  #topbar{
    position:fixed;left:0;right:0;top:0;z-index:35;display:flex;align-items:center;gap:9px;
    min-height:58px;padding:var(--bar-top) 10px 9px;
    background:linear-gradient(180deg,rgba(7,7,8,.96) 0%,rgba(7,7,8,.82) 68%,rgba(7,7,8,0) 100%);
    transition:transform .3s cubic-bezier(.22,.8,.3,1),opacity .22s ease;
  }
  .iconbtn{
    flex:none;display:grid;place-items:center;width:42px;height:42px;padding:0;border:0;border-radius:12px;
    background:rgba(28,28,30,.82);color:var(--text);text-decoration:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:background .14s,transform .12s;
  }
  .iconbtn:hover{background:rgba(44,44,46,.95)}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #who{min-width:0;flex:1;padding:0 2px}
  #who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15.5px;line-height:1.2;font-weight:750;letter-spacing:-.01em}
  #who span{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.2;font-variant-numeric:tabular-nums}
  #who span i{font-style:normal;opacity:.55}
  #who span b{display:inline;color:#fff;font-size:inherit;font-weight:650;letter-spacing:0}
  #chapterLabel{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:7px;
    background:rgba(255,255,255,.14);color:#fff;font-weight:750;letter-spacing:.02em;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
  #pagecount{flex:none;display:grid;place-items:center;min-width:48px;height:34px;padding:0 9px;border:0;border-radius:10px;
    background:rgba(28,28,30,.82);color:#fff;font:700 12px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    font-variant-numeric:tabular-nums;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:background .14s,transform .12s}
  #pagecount:hover{background:rgba(44,44,46,.95)}
  #pagecount:active{transform:scale(.94)}
  #pagecount[aria-expanded="true"]{background:var(--accent);color:#fff}
  #pagecount:focus-visible{outline:2px solid #fff;outline-offset:2px}
  #pageRail{position:fixed;z-index:34;top:calc(61px + env(safe-area-inset-top));left:10px;right:10px;
    max-width:720px;margin:0 auto;padding:7px;border:1px solid var(--line);border-radius:14px;
    background:rgba(17,17,19,.97);box-shadow:0 18px 46px rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  #pageRail[hidden]{display:none}
  #pageRailScroller{display:flex;gap:6px;overflow-x:auto;padding:2px;scroll-snap-type:x proximity;
    overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #pageRailScroller::-webkit-scrollbar{display:none}
  .page-chip{flex:0 0 auto;min-width:43px;height:48px;padding:0 10px;border:1px solid #2c2c2e;border-radius:9px;
    background:#1c1c1e;color:#d1d1d6;font:700 12.5px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    font-variant-numeric:tabular-nums;cursor:pointer;scroll-snap-align:center;-webkit-tap-highlight-color:transparent;
    transition:background .12s,border-color .12s,color .12s,transform .12s}
  .page-chip:hover{background:#2c2c2e;color:#fff}
  .page-chip:active{transform:scale(.96)}
  .page-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 0 0 1px rgba(255,69,58,.35)}
  .page-chip:focus-visible{outline:2px solid #fff;outline-offset:2px}
  body.chrome-off #pageRail{display:none}
  .pull-cue{--pull-accent:#3dd6c8;--pull-ink:#061514;--pull-deep:#25a99f;
    --pull-surface:#182223;--pull-line:#2b3b3c;--pull-text:#effcfb;
    position:fixed;left:50%;z-index:33;display:flex;opacity:0;pointer-events:none;
    will-change:transform,opacity;transform:translate3d(-50%,-64px,0) scale(.92);
    transition:opacity .18s ease,transform .3s cubic-bezier(.22,.8,.3,1)}
  .pull-cue.prev{top:calc(70px + env(safe-area-inset-top))}
  .pull-cue.next{bottom:calc(78px + env(safe-area-inset-bottom));transform:translate3d(-50%,64px,0) scale(.92)}
  body.chrome-off .pull-cue.prev{top:calc(12px + env(safe-area-inset-top))}
  body.chrome-off .pull-cue.next{bottom:calc(14px + env(safe-area-inset-bottom))}
  .pull-tab{position:relative;display:flex;align-items:center;gap:6px;width:118px;height:36px;
    padding:0 9px 0 5px;border-radius:10px;overflow:hidden;
    border:1px solid var(--pull-line);background:var(--pull-surface);
    transition:background .12s,border-color .12s}
  .pull-badge{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:6px;
    background:var(--pull-accent);color:var(--pull-ink);transition:background .12s,color .12s}
  .pull-chapter{font-size:10.5px;font-weight:850;line-height:1;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums}
  .pull-label{min-width:0;flex:1;color:var(--pull-text);font-size:8px;font-weight:800;line-height:1.2;
    letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:color .12s}
  .pull-chevron{width:11px;height:11px;flex:none;fill:none;stroke:var(--pull-accent);stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;transition:stroke .12s,transform .12s}
  .pull-meter{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--pull-line)}
  .pull-cue.next .pull-meter{top:0;bottom:auto}
  .pull-meter i{display:block;width:0;height:100%;background:var(--pull-accent)}
  .pull-cue.armed .pull-tab{background:var(--pull-accent);border-color:var(--pull-accent)}
  .pull-cue.armed .pull-badge{background:var(--pull-ink);color:var(--pull-accent)}
  .pull-cue.armed .pull-label{color:var(--pull-ink)}
  .pull-cue.armed .pull-chevron{stroke:var(--pull-ink);transform:translateY(-1px)}
  .pull-cue.next.armed .pull-chevron{transform:translateY(1px)}
  .pull-cue.armed .pull-meter{background:var(--pull-deep)}
  .pull-cue.armed .pull-meter i{background:var(--pull-ink)}
  .pull-cue.disabled .pull-tab{border-color:#242426;background:#141416}
  .pull-cue.disabled .pull-badge{background:#242426;color:#8e8e93}
  .pull-cue.disabled .pull-label{color:#8e8e93}
  .pull-cue.disabled .pull-chevron{stroke:#636366}
  .pull-cue.disabled .pull-meter{background:#242426}
  .pull-cue.disabled .pull-meter i{background:#636366}
  body.peek-open{overflow:hidden}
  #storyPeek{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
    padding-top:calc(10px + env(safe-area-inset-top));overflow:hidden}
  #storyPeek[hidden]{display:none}
  .peek-veil{position:absolute;inset:0;background:rgba(0,0,0,.74)}
  .peek-card{position:relative;z-index:1;display:flex;flex-direction:column;width:100%;height:100%;
    padding-bottom:env(safe-area-inset-bottom);overflow:hidden;border:1px solid #2a2a2c;border-bottom:0;
    border-radius:24px 24px 0 0;background:#0a0a0b;box-shadow:0 -26px 80px rgba(0,0,0,.72);
    will-change:transform;touch-action:pan-y;-webkit-backface-visibility:hidden;backface-visibility:hidden}
  .peek-grab{position:absolute;top:0;left:50%;z-index:4;display:grid;place-items:center;width:92px;height:30px;
    transform:translateX(-50%);cursor:grab;touch-action:none}
  .peek-grab i{display:block;width:44px;height:4px;border-radius:999px;background:rgba(255,255,255,.62);
    box-shadow:0 1px 4px rgba(0,0,0,.45);transition:background .15s}
  .peek-grab:active i{background:rgba(255,255,255,.9)}
  .peek-x{position:absolute;top:14px;right:14px;z-index:5;display:grid;place-items:center;width:36px;height:36px;
    padding:0;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(16,16,18,.88);
    color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .14s,transform .12s}
  .peek-x:hover{background:rgba(38,38,41,.86)}
  .peek-x:active{transform:scale(.94)}
  .peek-x svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  .peek-scroll{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-y}
  .peek-scroll::-webkit-scrollbar{display:none}
  .peek-hero{position:relative;height:clamp(255px,42vh,470px);background:#141416}
  .peek-hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 58%,#0a0a0b 100%)}
  .peek-cover{display:block;width:100%;height:100%;object-fit:cover;object-position:center 28%}
  .peek-body{padding:1px 20px 28px}
  .peek-title{margin:0;color:#fff;font-size:clamp(28px,8.5vw,36px);line-height:1.06;font-weight:800;
    letter-spacing:-.035em}
  .peek-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px 0;margin:10px 0 0;color:#c7c7cc;
    font-size:12.5px;font-weight:600;line-height:1.4}
  .peek-meta span{display:inline-flex;align-items:center}
  .peek-meta span+span::before{content:"·";margin:0 9px;color:#636366}
  .peek-actions{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:10px;margin-top:18px}
  .peek-read{display:flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 16px;border:0;
    border-radius:10px;background:var(--accent);color:#fff;font:750 14px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .14s,transform .12s}
  .peek-read:active{background:#e83c31;transform:scale(.99)}
  .peek-read svg,.peek-page svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .peek-page{display:grid;place-items:center;width:52px;height:50px;border:1px solid #2c2c2e;border-radius:10px;
    background:#1c1c1e;color:#ff6961;text-decoration:none;transition:background .14s,transform .12s}
  .peek-page:active{background:#2c2c2e;transform:scale(.97)}
  .peek-synopsis{margin:18px 0 0;color:#f2f2f7;font-size:15px;line-height:1.62;white-space:pre-line}
  .peek-tags{display:flex;gap:8px;margin-top:18px;overflow-x:auto;padding:0 0 2px;scrollbar-width:none}
  .peek-tags::-webkit-scrollbar{display:none}
  .peek-tag{flex:none;padding:7px 14px;border:1px solid rgba(255,255,255,.55);border-radius:999px;color:#f2f2f7;
    font-size:12.5px;font-weight:600;line-height:1.3;white-space:nowrap}
  .peek-chapter-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:28px;
    padding-bottom:11px;border-bottom:1px solid #242426}
  .peek-chapter-head b{color:#fff;font-size:19px;font-weight:800;letter-spacing:-.015em}
  .peek-chapter-head span{color:#8e8e93;font-size:11.5px;font-weight:650}
  .peek-chapters{display:flex;flex-direction:column}
  .peek-chapter{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 2px;
    border-bottom:1px solid #1d1d1f;color:#f5f5f7;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .peek-chapter span{min-width:0;font-size:14.5px;font-weight:700;letter-spacing:-.01em;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .peek-chapter small{flex:none;color:#8e8e93;font-size:11px;font-variant-numeric:tabular-nums}
  .peek-chapter.on span{color:var(--accent)}
  .peek-chapter:active{background:#141416}
  @media (min-width:721px){
    #storyPeek{align-items:stretch;justify-content:flex-end;padding:0}
    .peek-card{width:min(460px,calc(100vw - 48px));height:100%;border:0;border-left:1px solid #2a2a2c;
      border-radius:22px 0 0 22px;box-shadow:-26px 0 80px rgba(0,0,0,.66)}
    .peek-hero{height:clamp(280px,40vh,390px)}
    .peek-body{padding:1px 24px 34px}
    .peek-title{font-size:31px}
  }
  main{padding:calc(58px + env(safe-area-inset-top)) 0 calc(82px + env(safe-area-inset-bottom));transition:padding .26s ease}
  #pages{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:100vh}
  figure{margin:0;width:min(100%,920px);background:#0d0d0f;overflow:hidden}
  /* width/height on the image reserve a box until the file lands; once it
     does the browser uses the file's own ratio, so pages stay full width and
     no script resizes the document under the reader */
  figure img{display:block;width:100%;height:auto;background:#0d0d0f}
  figure img:not([src]){visibility:hidden}
  #loading{display:grid;place-items:center;min-height:70vh;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  #loading[hidden]{display:none}
  #error{display:none;margin:24vh auto 0;max-width:330px;padding:26px 22px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-align:center}
  #error.on{display:block}
  #error b{display:block;margin-bottom:7px;font-size:23px;font-weight:800;letter-spacing:-.02em}
  #error span{color:var(--muted);font-size:13.5px}
  #error a{display:inline-flex;margin-top:16px;padding:10px 16px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:650}
  #bottombar{
    position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;align-items:center;justify-content:center;gap:0;
    padding:9px 10px var(--bar-bottom);
    background:linear-gradient(0deg,rgba(7,7,8,.98) 0%,rgba(7,7,8,.86) 72%,rgba(7,7,8,0) 100%);
    transition:transform .3s cubic-bezier(.22,.8,.3,1),opacity .22s ease;
  }
  #chapterNav{display:inline-flex;align-items:center;min-width:0;max-width:100%;overflow:hidden;
    border:1px solid var(--line);border-radius:12px;background:rgba(28,28,30,.92)}
  #prevBtn,#nextBtn{width:44px;height:44px;border-radius:0;background:transparent}
  #prevBtn{border-right:1px solid var(--line)}
  #nextBtn{border-left:1px solid var(--line)}
  #prevBtn:hover,#nextBtn:hover{background:rgba(44,44,46,.95)}
  #chapterPick{position:relative;flex:0 1 210px;width:210px;min-width:0;margin:0}
  #chapterPick::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid #8e8e93;border-bottom:1.5px solid #8e8e93;transform:translateY(-70%) rotate(45deg);pointer-events:none;transition:transform .18s ease}
  #chapterPick.open::after{transform:translateY(-30%) rotate(225deg)}
  #chapterSelect{display:flex;align-items:center;width:100%;height:44px;padding:0 34px 0 13px;border:0;
    border-radius:0;background:transparent;color:#f5f5f7;font-size:12.5px;font-weight:650;
    text-align:left;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}
  #chapterSelect span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #chapterSelect:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  body.chapter-open{overflow:hidden}
  #chapterPicker{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
    padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
  #chapterPicker[hidden]{display:none}
  .chapter-veil{position:absolute;inset:0;background:rgba(0,0,0,.72);opacity:0;transition:opacity .24s ease}
  #chapterPicker.open .chapter-veil{opacity:1}
  .chapter-sheet{position:relative;z-index:1;display:flex;flex-direction:column;width:min(100%,430px);
    max-height:min(66vh,560px);overflow:hidden;border:1px solid #2a2a2c;border-radius:18px;background:#000;
    box-shadow:0 24px 70px rgba(0,0,0,.72);
    transform:translate3d(0,24px,0) scale(.98);opacity:0;
    transition:transform .3s cubic-bezier(.22,.8,.3,1),opacity .22s ease}
  #chapterPicker.open .chapter-sheet{transform:translate3d(0,0,0) scale(1);opacity:1}
  .chapter-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex:none;
    padding:16px 18px 13px;border-bottom:1px solid #1f1f21}
  .chapter-kicker{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8e8e93;
    font-size:10px;font-weight:800;line-height:1.3;letter-spacing:.12em;text-transform:uppercase}
  .chapter-head h2{margin:4px 0 0;color:#fff;font-size:24px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
  .chapter-head p{margin:6px 0 0;color:#8e8e93;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .chapter-close{display:grid;place-items:center;width:36px;height:36px;flex:none;padding:0;border:1px solid #2c2c2e;
    border-radius:50%;background:#1c1c1e;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:background .14s,transform .12s}
  .chapter-close:hover{background:#2c2c2e}
  .chapter-close:active{transform:scale(.94)}
  .chapter-close:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .chapter-close svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  .chapter-scroll{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding:12px 14px 16px}
  .chapter-scroll::-webkit-scrollbar{display:none}
  .chapter-list{display:flex;flex-direction:column;gap:8px;padding-left:10px;border-left:3px solid var(--accent)}
  .chapter-row{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:56px;
    padding:14px;border:1px solid #1f1f21;border-radius:12px;background:#0d0d0d;color:#fff;
    text-decoration:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box;
    transition:background .12s,border-color .12s}
  .chapter-row:hover{background:#171719;border-color:#2c2c2e}
  .chapter-row:active{background:#171719;border-color:#2c2c2e}
  .chapter-row:focus-visible{outline:2px solid #fff;outline-offset:-2px}
  .chapter-row.on{background:#0d0d0d;border-color:var(--accent)}
  .chapter-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;
    font-weight:700;line-height:1.22;letter-spacing:-.012em}
  .chapter-when{flex:none;color:#8e8e93;font-size:13.5px;font-variant-numeric:tabular-nums}
  .chapter-row.on .chapter-when{color:#ff6961;font-weight:650}
  @media (min-width:721px){
    #chapterPicker{align-items:center;padding:24px}
    .chapter-sheet{width:min(440px,calc(100vw - 48px));max-height:min(66vh,560px);border-radius:18px}
    .chapter-head{padding:18px 20px 14px}
    .chapter-scroll{padding:12px 16px 18px}
  }
  #prevBtn[hidden],#nextBtn[hidden]{display:none}
  body.chrome-off #topbar{transform:translateY(calc(-100% - 12px));opacity:0;pointer-events:none}
  body.chrome-off #bottombar{transform:translateY(calc(100% + 12px));opacity:0;pointer-events:none}
  body.chrome-off main{padding-top:0;padding-bottom:0}
  @media (min-width:721px){
    #topbar{padding-left:18px;padding-right:18px}
    #bottombar{padding-left:18px;padding-right:18px}
  }
  @media (prefers-reduced-motion:reduce){
    #topbar,#bottombar,main{transition:none}
    .chapter-veil,.chapter-sheet{transition:none}
  }
  /* ---------- leaving the reader ---------- */
  .reader-veil{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
    background:rgba(4,4,5,.42);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);
    opacity:0;pointer-events:none;transition:opacity .18s ease-out,background-color .3s ease-out}
  .reader-veil.on{opacity:1;pointer-events:auto}
  .reader-veil.out{background:#040405}
  .reader-veil-text{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:clamp(38px,12vw,88px);font-weight:900;line-height:.92;letter-spacing:-.035em;
    text-transform:uppercase;text-align:center;color:#f4f6f8;
    text-shadow:0 1px 0 rgba(255,255,255,.07),0 3px 0 rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.45);
    animation:readerVeilIn .45s cubic-bezier(.22,.8,.3,1) both;
    padding:0 16px;max-width:min(92vw,760px)}
  .reader-veil.out .reader-veil-text{opacity:0;transition:opacity .2s ease-in}
  @keyframes readerVeilIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.reader-veil-text{animation:readerVeilIn .01s both}}
</style>
</head>
<body>
<header id="topbar">
  <a class="iconbtn" id="closeBtn" href="/" aria-label="Back to story">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <button class="iconbtn" id="storyBtn" type="button" aria-label="Preview story" title="Story preview" aria-haspopup="dialog" aria-expanded="false" aria-controls="storyPeek">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11.2v5"/><path d="M12 7.6h.01"/></svg>
  </button>
  <div id="who">
    <b id="storyTitle">Reader</b>
    <span><span id="chapterLabel">Loading</span></span>
  </div>
  <button id="pagecount" type="button" aria-label="Open page jump" aria-haspopup="true" aria-expanded="false" aria-controls="pageRail">1/1</button>
</header>

<div id="pageRail" hidden>
  <div id="pageRailScroller" role="group" aria-label="Jump to page"></div>
</div>

<div class="pull-cue prev" id="pullPrev" aria-hidden="true">
  <div class="pull-tab">
    <span class="pull-badge"><span class="pull-chapter" id="pullPrevChapter">01</span></span>
    <span class="pull-label" id="pullPrevText">Previous</span>
    <svg class="pull-chevron" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    <span class="pull-meter"><i id="pullPrevMeter"></i></span>
  </div>
</div>
<div class="pull-cue next" id="pullNext" aria-hidden="true">
  <div class="pull-tab">
    <span class="pull-badge"><span class="pull-chapter" id="pullNextChapter">01</span></span>
    <span class="pull-label" id="pullNextText">Next</span>
    <svg class="pull-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    <span class="pull-meter"><i id="pullNextMeter"></i></span>
  </div>
</div>

<div id="storyPeek" hidden>
  <div class="peek-veil" data-peek-close></div>
  <section class="peek-card" id="peekCard" role="dialog" aria-modal="true" aria-labelledby="peekTitle">
    <div class="peek-grab" id="peekGrab" aria-hidden="true"><i></i></div>
    <button class="peek-x" id="peekClose" type="button" aria-label="Close story preview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="peek-scroll" id="peekScroll">
      <div class="peek-hero" id="peekHero">
        <img class="peek-cover" id="peekCover" alt="" decoding="async">
      </div>
      <div class="peek-body">
        <h2 class="peek-title" id="peekTitle">Story</h2>
        <p class="peek-meta" id="peekMeta"></p>
        <div class="peek-actions">
          <button class="peek-read" id="peekRead" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H11v16H5.5A2.5 2.5 0 0 0 3 21.5z"/><path d="M21 5.5A2.5 2.5 0 0 0 18.5 3H13v16h5.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg>
            <span>Continue reading</span>
          </button>
          <a class="peek-page" id="peekOpen" href="/" aria-label="Open story page" title="Open story page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>
          </a>

        <p class="peek-synopsis" id="peekSynopsis"></p>

        <div class="peek-chapter-head"><b>Chapters</b><span id="peekChapterCount"></span></div>

    </div>
  </section>
</div>

<div id="chapterPicker" hidden>
  <div class="chapter-veil" data-chapter-close></div>
  <section class="chapter-sheet" id="chapterSheet" role="dialog" aria-modal="true" aria-labelledby="chapterPickerTitle">
    <header class="chapter-head">
      <div>
        <span class="chapter-kicker" id="chapterStory">Story</span>
        <h2 id="chapterPickerTitle">Chapters</h2>

      <button class="chapter-close" id="chapterClose" type="button" aria-label="Close chapter list">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

    <div class="chapter-scroll" id="chapterScroll">
      <div class="chapter-list" id="chapterList"></div>
    </div>
  </section>
</div>

<main>
  <div id="pages"></div>
  <div id="loading">Loading story</div>
  <div id="error">
    <b>Story unavailable</b>
    <span id="errorText">This local story could not be opened.</span>
    <a href="/">Back to shelves</a>

<nav id="bottombar" aria-label="Reader navigation">
  <div id="chapterNav">
    <a class="iconbtn" id="prevBtn" href="#" aria-label="Previous chapter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div id="chapterPick">
      <button id="chapterSelect" type="button" aria-label="Chapter" aria-haspopup="dialog" aria-expanded="false" aria-controls="chapterPicker">
        <span id="chapterSelectLabel">Chapter 1</span>
      </button>
    </div>
    <a class="iconbtn" id="nextBtn" href="#" aria-label="Next chapter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>
  </div>
</nav>

<script>
(function () {
  "use strict";

  /* the reader restores its own saved page; letting the browser restore a
     stale scroll first is what made a chapter open at the end and snap away */
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";

  var harvestMatch = /^\/reader\/harvest\/(kun|bato|comick)\/([^/]+)(?:\/([^/]+))?\/?$/.exec(location.pathname);
  var match = harvestMatch ? null : /^\/reader\/(series\/)?([^/]+)(?:\/([^/]+))?\/?$/.exec(location.pathname);
  if (!match && !harvestMatch) { fail("This reader URL is not valid."); return; }
  var isHarvest = !!harvestMatch;
  var harvestSource = isHarvest ? harvestMatch[1] : "";
  var isSeries = !isHarvest && !!match[1];
  var slug = decodeURIComponent(isHarvest ? harvestMatch[2] : match[2]);
  /* a harvest chapter token is the source's own (a number, or comick's hid),
     so an empty one means "the first chapter" rather than "chapter 1" */
  var chapterToken = isHarvest
    ? (harvestMatch[3] ? decodeURIComponent(harvestMatch[3]) : "")
    : (match[3] ? decodeURIComponent(match[3]) : "1");
  var basePath = isHarvest ? "/reader/harvest/" + harvestSource + "/" : (isSeries ? "/reader/series/" : "/reader/");
  var storyPath = isHarvest ? "/#library" : (isSeries ? "/#story/series/" : "/#story/");
  var dataRoot = isHarvest
    ? "/api/reader_data/harvest/" + harvestSource + "/" + encodeURIComponent(slug) + "/"
    : (isSeries ? "/api/reader_data/series/" : "/api/reader_data/") + encodeURIComponent(slug) + "/";
  var pagesEl = document.getElementById("pages");
  var loadingEl = document.getElementById("loading");
  var errorEl = document.getElementById("error");
  var titleEl = document.getElementById("storyTitle");
  var chapterLabelEl = document.getElementById("chapterLabel");
  var pageCountEl = document.getElementById("pagecount");
  var pageRail = document.getElementById("pageRail");
  var pageRailScroller = document.getElementById("pageRailScroller");
  var pageChips = [];
  var storyPeek = document.getElementById("storyPeek");
  var peekCard = document.getElementById("peekCard");
  var peekScroll = document.getElementById("peekScroll");
  var peekHero = document.getElementById("peekHero");
  var peekCover = document.getElementById("peekCover");
  var peekMeta = document.getElementById("peekMeta");
  var peekTitle = document.getElementById("peekTitle");
  var peekTags = document.getElementById("peekTags");
  var peekSynopsis = document.getElementById("peekSynopsis");
  var peekRead = document.getElementById("peekRead");
  var peekOpen = document.getElementById("peekOpen");
  var peekChapters = document.getElementById("peekChapters");
  var peekChapterCount = document.getElementById("peekChapterCount");
  var peekGrab = document.getElementById("peekGrab");
  var peekClose = document.getElementById("peekClose");
  var peekCloseTimer = 0;
  var peekHoverTimer = 0;
  var peekOpenFrame = 0;
  var peekDragFrame = 0;
  var peekStartY = 0;
  var peekStartX = 0;
  var peekLastY = 0;
  var peekLastTime = 0;
  var peekVelocity = 0;
  var peekDragY = 0;
  var peekCardHeight = 0;
  var peekTracking = false;
  var peekFromGrab = false;
  var pullPrev = document.getElementById("pullPrev");
  var pullNext = document.getElementById("pullNext");
  var pullPrevText = document.getElementById("pullPrevText");
  var pullNextText = document.getElementById("pullNextText");
  var pullPrevChapter = document.getElementById("pullPrevChapter");
  var pullNextChapter = document.getElementById("pullNextChapter");
  var pullPrevMeter = document.getElementById("pullPrevMeter");
  var pullNextMeter = document.getElementById("pullNextMeter");
  var pullTracking = false;
  var pullStartX = 0;
  var pullStartY = 0;
  var pullAtTop = false;
  var pullAtBottom = false;
  var pullDirection = "";
  var pullProgress = 0;
  var pullRaw = 0;
  var pullCanGo = false;
  var pullHref = "";
  var pullTargetLabel = "";
  var pullFrame = 0;
  var pullCueTimer = 0;
  var pullNavigating = false;
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var chapterSelect = document.getElementById("chapterSelect");
  var chapterSelectLabel = document.getElementById("chapterSelectLabel");
  var chapterPick = document.getElementById("chapterPick");
  var chapterPicker = document.getElementById("chapterPicker");
  var chapterSheet = document.getElementById("chapterSheet");
  var chapterScroll = document.getElementById("chapterScroll");
  var chapterList = document.getElementById("chapterList");
  var chapterClose = document.getElementById("chapterClose");
  var chapterStory = document.getElementById("chapterStory");
  var chapterPickerMeta = document.getElementById("chapterPickerMeta");
  var chapterCloseTimer = 0;
  var chapterPickerOpen = false;
  var closeBtn = document.getElementById("closeBtn");
  var storyBtn = document.getElementById("storyBtn");
  var story = null;
  var chapter = null;
  var chapterIndex = 0;
  var figures = [];
  var pages = [];
  var currentPage = 0;
  var saveTimer = 0;
  var restoreTarget = null;
  var restoring = false;
  var lastScrollY = 0;
  var scrollTick = false;
  var touchStartY = 0;
  var touchStartX = 0;
  var touchStartTime = 0;
  var touchMoved = false;
  var suppressTapUntil = 0;

  function fail(message) {
    loadingEl.hidden = true;
    errorEl.classList.add("on");
    var text = document.getElementById("errorText");
    if (text && message) text.textContent = message;
    document.title = "Story unavailable";
  }

  function safeGet(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (err) { return fallback; }
  }

  function safeSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* private mode */ }
  }

  function chapterHref(token) {
    return basePath + encodeURIComponent(slug) + "/" + encodeURIComponent(token);
  }

  function pageSrc(page) {
    var relative = typeof page === "string" ? page : page && page.src;
    if (!relative) return "";
    if (relative.charAt(0) === "/" || /^https?:\/\//i.test(relative)) return relative;
    return dataRoot + relative;
  }

  function pageLabel() {
    return chapter.l || chapter.n;
  }

  function storyCoverSrc() {
    var cover = story && story.cover;
    if (!cover) return "";
    if (cover.charAt(0) === "/" || /^https?:\/\//i.test(cover)) return cover;
    return dataRoot + cover;
  }

  function setPageNumber(index) {
    currentPage = Math.max(0, Math.min(figures.length - 1, index));
    var human = currentPage + 1;
    if (pageCountEl) {
      pageCountEl.textContent = human + "/" + figures.length;
      pageCountEl.setAttribute("aria-label", "Page " + human + " of " + figures.length + ". Open page jump.");
    }
    syncPageChips();
  }

  function syncPageChips() {
    for (var i = 0; i < pageChips.length; i += 1) {
      var on = i === currentPage;
      pageChips[i].classList.toggle("on", on);
      if (on) pageChips[i].setAttribute("aria-current", "page");
      else pageChips[i].removeAttribute("aria-current");
    }
  }

  function buildPageRail() {
    if (!pageRailScroller) return;
    pageChips = [];
    var frag = document.createDocumentFragment();
    for (var p = 0; p < figures.length; p += 1) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "page-chip";
      chip.dataset.page = String(p);
      chip.textContent = String(p + 1);
      chip.setAttribute("aria-label", "Go to page " + (p + 1));
      pageChips.push(chip);
      frag.append(chip);
    }
    pageRailScroller.replaceChildren(frag);
    pageRailScroller.scrollLeft = 0;
    syncPageChips();
  }

  function centerPageChip(index, behavior) {
    var chip = pageChips[index];
    if (!chip || !pageRailScroller) return;
    var left = chip.offsetLeft - (pageRailScroller.clientWidth - chip.offsetWidth) / 2;
    try {
      pageRailScroller.scrollTo({ left: Math.max(0, left), behavior: behavior || "smooth" });
    } catch (err) {
      pageRailScroller.scrollLeft = Math.max(0, left);
    }
  }

  function openPageRail() {
    if (!pageRail || !figures.length) return;
    document.body.classList.remove("chrome-off");
    pageRail.hidden = false;
    pageCountEl.setAttribute("aria-expanded", "true");
    syncPageChips();
    requestAnimationFrame(function () {
      centerPageChip(currentPage, "auto");
      if (pageChips[currentPage]) pageChips[currentPage].focus({ preventScroll: true });
    });
  }

  function closePageRail() {
    if (!pageRail || pageRail.hidden) return;
    pageRail.hidden = true;
    pageCountEl.setAttribute("aria-expanded", "false");
  }

  function jumpToPage(index) {
    var fig = figures[index];
    if (!fig) return;
    var topbar = document.getElementById("topbar");
    var offset = document.body.classList.contains("chrome-off") ? 0 : (topbar ? topbar.offsetHeight : 0);
    var y = Math.max(0, fig.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0) - offset);
    closePageRail();
    window.scrollTo(0, y);
    lastScrollY = window.scrollY || y;
    setPageNumber(index);
    savePosition();
  }

  function buildPeekChapters() {
    if (!peekChapters || !story) return;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < story.chapters.length; i += 1) {
      var item = story.chapters[i];
      var row = document.createElement("a");
      row.className = "peek-chapter";
      row.href = chapterHref(item.n);
      var label = document.createElement("span");
      label.textContent = "Ch. " + (item.l || item.n) + " - Chapter " + item.n;
      var count = document.createElement("small");
      count.textContent = item.pages && item.pages.length ? item.pages.length + "p" : "";
      row.append(label, count);
      if (chapter && String(item.n) === String(chapter.n)) {
        row.classList.add("on");
        row.setAttribute("aria-current", "page");
      }
      frag.append(row);
    }
    peekChapters.replaceChildren(frag);
    if (peekChapterCount) peekChapterCount.textContent = story.chapters.length + " total";
  }

  function buildChapterPicker() {
    if (!chapterList || !story) return;
    var frag = document.createDocumentFragment();
    var totalPages = 0;
    for (var i = 0; i < story.chapters.length; i += 1) {
      var item = story.chapters[i];
      var pageTotal = item.pages && item.pages.length ? item.pages.length : 0;
      totalPages += pageTotal;
      var label = String(item.l || item.n);
      var current = chapter && String(item.n) === String(chapter.n);
      var row = document.createElement("a");
      row.className = "chapter-row";
      row.href = chapterHref(item.n);
      row.setAttribute("aria-label", "Chapter " + label + ", " + pageTotal + (pageTotal === 1 ? " page" : " pages") + (current ? ", currently reading" : ""));
      var chapterLabel = document.createElement("span");
      chapterLabel.className = "chapter-label";
      chapterLabel.textContent = /^[0-9]/.test(label)
        ? "Ch. " + label + " - Chapter " + label
        : "Ch. " + label;
      var when = document.createElement("span");
      when.className = "chapter-when";
      when.textContent = current ? "Reading" : (pageTotal ? pageTotal + "p" : "");
      row.append(chapterLabel, when);
      if (current) {
        row.classList.add("on");
        row.setAttribute("aria-current", "page");
      }
      frag.append(row);
    }
    chapterList.replaceChildren(frag);
    if (chapterStory) chapterStory.textContent = story.title || "Story";
    if (chapterPickerMeta) {
      chapterPickerMeta.textContent = story.chapters.length + (story.chapters.length === 1 ? " chapter" : " chapters") +
        (totalPages ? " · " + totalPages + " pages" : "");
    }
  }

  function openChapterPicker() {
    if (!story || !chapterPicker) return;
    if (chapterPickerOpen) return;
    buildChapterPicker();
    closePageRail();
    if (storyPeek && !storyPeek.hidden) closeStoryPeek(true);
    clearTimeout(chapterCloseTimer);
    chapterCloseTimer = 0;
    chapterPickerOpen = true;
    chapterPicker.hidden = false;
    chapterSelect.setAttribute("aria-expanded", "true");
    if (chapterPick) chapterPick.classList.add("open");
    document.body.classList.add("chapter-open");
    chapterScroll.scrollTop = 0;
    requestAnimationFrame(function () {
      chapterPicker.classList.add("open");
      var current = chapterList.querySelector(".chapter-row.on");
      if (current) {
        var scrollRect = chapterScroll.getBoundingClientRect();
        var rowRect = current.getBoundingClientRect();
        chapterScroll.scrollTop = Math.max(0, chapterScroll.scrollTop + rowRect.top - scrollRect.top - (scrollRect.height - rowRect.height) / 2);
        current.focus({ preventScroll: true });
      } else if (chapterClose) {
        chapterClose.focus({ preventScroll: true });
      }
    });
  }

  function closeChapterPicker(restoreFocus) {
    if (!chapterPicker || !chapterPickerOpen) return;
    chapterPickerOpen = false;
    chapterPicker.classList.remove("open");
    chapterSelect.setAttribute("aria-expanded", "false");
    if (chapterPick) chapterPick.classList.remove("open");
    document.body.classList.remove("chapter-open");
    clearTimeout(chapterCloseTimer);
    chapterCloseTimer = setTimeout(function () {
      chapterPicker.hidden = true;
      chapterCloseTimer = 0;
    }, 340);
    if (restoreFocus) chapterSelect.focus({ preventScroll: true });
  }

  function fillStoryPeek() {
    if (!story) return;
    if (!story.detailsLoaded) {
      story.detailsLoaded = true;
      fetch((isSeries ? "/api/story/series/" : "/api/story/") + encodeURIComponent(slug))
        .then(function (response) { return response.ok ? response.json() : null; })
        .then(function (details) {
          if (!details) return;
          story.status = story.status || details.status || "";
          story.description = story.description || details.description || details.teaser || "";
          if (!Array.isArray(story.genres) || !story.genres.length) story.genres = details.genres || [];
          fillStoryPeek();
        })
        .catch(function () {});
    }
    var cover = storyCoverSrc();
    if (cover) {
      peekCover.src = cover;
      peekCover.alt = (story.title || "Story") + " cover";
      peekCover.hidden = false;
      if (peekHero) peekHero.hidden = false;
    } else {
      peekCover.removeAttribute("src");
      peekCover.hidden = true;
      if (peekHero) peekHero.hidden = true;
    }
    peekTitle.textContent = story.title || "Untitled story";
    var bits = [];
    if (story.status) bits.push(story.status);
    if (Array.isArray(story.chapters) && story.chapters.length) {
      bits.push(story.chapters.length + (story.chapters.length === 1 ? " chapter" : " chapters"));
    }
    peekMeta.replaceChildren();
    for (var m = 0; m < bits.length; m += 1) {
      var part = document.createElement("span");
      part.textContent = bits[m];
      peekMeta.append(part);
    }
    peekSynopsis.textContent = story.description || story.teaser || "No synopsis available for this story yet.";
    peekOpen.href = isHarvest ? (story.source || "/#library") : storyPath + encodeURIComponent(slug);
    var tags = Array.isArray(story.genres) ? story.genres.filter(Boolean).slice(0, 12) : [];
    peekTags.replaceChildren();
    for (var i = 0; i < tags.length; i += 1) {
      var tag = document.createElement("span");
      tag.className = "peek-tag";
      tag.textContent = tags[i];
      peekTags.append(tag);
    }
    buildPeekChapters();
  }

  function openStoryPeek(focus) {
    if (!story || !storyPeek || !storyPeek.hidden) return;
    fillStoryPeek();
    closePageRail();
    clearTimeout(peekCloseTimer);
    if (peekOpenFrame) cancelAnimationFrame(peekOpenFrame);
    if (peekDragFrame) { cancelAnimationFrame(peekDragFrame); peekDragFrame = 0; }
    peekCloseTimer = 0;
    peekTracking = false;
    peekDragY = 0;
    peekCard.style.transition = "none";
    peekCard.style.transform = "translate3d(0,100%,0)";
    storyPeek.hidden = false;
    storyBtn.setAttribute("aria-expanded", "true");
    document.body.classList.add("peek-open");
    peekScroll.scrollTop = 0;
    void peekCard.offsetHeight;
    peekOpenFrame = requestAnimationFrame(function () {
      peekOpenFrame = 0;
      peekCard.style.transition = "transform .34s cubic-bezier(.22,.8,.3,1)";
      peekCard.style.transform = "translate3d(0,0,0)";
    });
    if (focus) peekClose.focus({ preventScroll: true });
  }

  function closeStoryPeek(instant) {
    if (!storyPeek || storyPeek.hidden) return;
    if (peekOpenFrame) { cancelAnimationFrame(peekOpenFrame); peekOpenFrame = 0; }
    if (peekDragFrame) { cancelAnimationFrame(peekDragFrame); peekDragFrame = 0; }
    peekTracking = false;
    clearTimeout(peekCloseTimer);
    storyBtn.setAttribute("aria-expanded", "false");
    document.body.classList.remove("peek-open");
    var finish = function () {
      peekCloseTimer = 0;
      storyPeek.hidden = true;
      peekCard.style.transition = "";
      peekCard.style.transform = "";
      peekScroll.scrollTop = 0;
    };
    if (instant) {
      finish();
      return;
    }
    var distance = Math.max(peekCard.offsetHeight, window.innerHeight || 0);
    peekCard.style.transition = "transform .24s cubic-bezier(.32,.72,0,1)";
    peekCard.style.transform = "translate3d(0," + distance + "px,0)";
    peekCloseTimer = setTimeout(finish, 270);
  }

  function paintPeekDrag() {
    peekDragFrame = 0;
    if (!peekTracking) return;
    peekCard.style.transform = "translate3d(0," + peekDragY + "px,0)";
  }

  function cancelPeekDrag() {
    peekTracking = false;
    peekDragY = 0;
    if (peekDragFrame) { cancelAnimationFrame(peekDragFrame); peekDragFrame = 0; }
    peekCard.style.transition = "";
    peekCard.style.transform = "";

    if (readerExiting) return;
    readerExiting = true;
    exitVeil.classList.add("on");
    /* the app raises the same veil on arrival, so keep this one up through the
       navigation and let the destination fade it out.  If Back restores this
       page, pageshow clears the veil so it never comes back mid-exit. */
    exitTimer = setTimeout(function () {
      location.href = withFrom(href || "/");
    }, 620);
  }
  function resetExitVeil() {
    if (exitTimer) { clearTimeout(exitTimer); exitTimer = 0; }
    readerExiting = false;
    exitVeil.classList.remove("on", "out");
  }
  window.addEventListener("pageshow", resetExitVeil);
  window.addEventListener("popstate", resetExitVeil);
  window.addEventListener("pagehide", function (event) {
    if (event.persisted) resetExitVeil();
  });
  /* the close arrow steps back to the story/cover page, not out of the app:
     let the link navigate normally so no veil or ?from=reader hand-off is
     raised on either side of the jump */
})();
</script>
</body>
</html>
